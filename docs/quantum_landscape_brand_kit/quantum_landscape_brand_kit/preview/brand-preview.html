<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Quantum Landscape brand preview</title><link rel="stylesheet" href="../brand.css"/>
<style>
body{margin:0;background:#f6f8fc;color:#071225;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:0 auto;padding:40px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{border-radius:32px;padding:36px;border:1px solid rgba(2,11,28,.1)}.dark{background:#020b1c}.light{background:#fff}img{max-width:100%;height:auto}.palette{display:flex;gap:14px;flex-wrap:wrap}.swatch{width:120px}.dot{height:68px;border-radius:20px;border:1px solid rgba(2,11,28,.15)}code{background:rgba(2,11,28,.06);padding:.15rem .35rem;border-radius:.4rem}</style></head>
<body><div class="wrap"><h1 class="ql-wordmark">Quantum Landscape</h1><p>Brand preview for web implementation.</p><div class="grid"><div class="card dark"><img src="../svg/quantum-landscape-wordmark-horizontal-on-dark.svg"></div><div class="card light"><img src="../svg/quantum-landscape-wordmark-horizontal-on-light.svg"></div></div><h2>Palette</h2><div class="palette">
<div class="swatch"><div class="dot" style="background:#020B1C"></div><strong>Navy</strong><br><code>#020B1C</code></div><div class="swatch"><div class="dot" style="background:#071225"></div><strong>Ink</strong><br><code>#071225</code></div><div class="swatch"><div class="dot" style="background:#15D5FF"></div><strong>Cyan</strong><br><code>#15D5FF</code></div><div class="swatch"><div class="dot" style="background:#2E7CFF"></div><strong>Azure</strong><br><code>#2E7CFF</code></div><div class="swatch"><div class="dot" style="background:#6E8CFF"></div><strong>Periwinkle</strong><br><code>#6E8CFF</code></div><div class="swatch"><div class="dot" style="background:#8A5CF6"></div><strong>Violet</strong><br><code>#8A5CF6</code></div><div class="swatch"><div class="dot" style="background:#C7B7FF"></div><strong>Lilac</strong><br><code>#C7B7FF</code></div><div class="swatch"><div class="dot" style="background:#F6F8FC"></div><strong>Paper</strong><br><code>#F6F8FC</code></div></div></div></body></html>
