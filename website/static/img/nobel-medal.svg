<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Nobel Prize medal">
  <defs>
    <radialGradient id="nobelFace" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#fbe9a8"/>
      <stop offset="45%" stop-color="#e8b94e"/>
      <stop offset="100%" stop-color="#9a6f1d"/>
    </radialGradient>
    <linearGradient id="nobelRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d27a"/>
      <stop offset="100%" stop-color="#7d5614"/>
    </linearGradient>
  </defs>
  <!-- outer rim -->
  <circle cx="50" cy="50" r="47" fill="url(#nobelRim)"/>
  <circle cx="50" cy="50" r="42" fill="url(#nobelFace)" stroke="#7d5614" stroke-width="1.5"/>
  <!-- inner bevel ring -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="#a87a22" stroke-width="1.4" opacity="0.7"/>
  <!-- laurel wreath: left branch -->
  <g fill="#8a5f17" opacity="0.85">
    <path d="M34 74 q-9 -10 -8 -24 q5 7 9 10 q-4 6 -1 14 z"/>
    <path d="M28 58 q-6 -7 -5 -16 q4 5 7 7 q-3 4 -2 9 z"/>
    <!-- right branch (mirror) -->
    <path d="M66 74 q9 -10 8 -24 q-5 7 -9 10 q4 6 1 14 z"/>
    <path d="M72 58 q6 -7 5 -16 q-4 5 -7 7 q3 4 2 9 z"/>
  </g>
  <!-- central star -->
  <path d="M50 30 l4.6 9.4 10.4 1.5 -7.5 7.3 1.8 10.3 -9.3 -4.9 -9.3 4.9 1.8 -10.3 -7.5 -7.3 10.4 -1.5 z"
        fill="#fff3cf" stroke="#7d5614" stroke-width="0.8" opacity="0.95"/>
</svg>
