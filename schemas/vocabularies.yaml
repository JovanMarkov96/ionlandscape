# Quantum Landscape — Controlled Vocabularies
#
# Canonical source for every enum value referenced by the v2 person schema,
# the v1 company schema, and the v1 institution schema. Schemas inline these
# enums (JSON Schema doesn't read YAML); when adding values here, also add
# them to the corresponding schemas/*.schema.json file. The schema files
# carry a `vocab_source` annotation pointing back at this file.
#
# Versioning: when a vocabulary is changed in a backwards-incompatible way
# (renaming, removing a value), bump the schema_version of the affected
# schemas. Adding a value is non-breaking.

# ── Platforms ────────────────────────────────────────────────────────────
# The physical-system axis. An entity (person, company, institution) can
# carry multiple platforms when it spans them (e.g. a hybrid trapped-ion +
# neutral-atom group). For software-only companies, populate platforms with
# the platforms their software *targets* (e.g. Q-CTRL → [trapped_ion,
# superconducting, neutral_atom]).

platforms:
  - id: trapped_ion
    label: "Trapped ions"
    notes: "Linear / 2D / segmented Paul traps; Penning traps."
  - id: neutral_atom
    label: "Neutral atoms"
    notes: "Single atoms / arrays; non-Rydberg-engaged use cases."
  - id: rydberg_array
    label: "Rydberg atom arrays"
    notes: "Specifically Rydberg-mediated computing/simulation."
  - id: superconducting
    label: "Superconducting qubits"
    notes: "Transmon, fluxonium, cQED, etc."
  - id: nv_center
    label: "NV centres"
    notes: "Nitrogen-vacancy centres in diamond."
  - id: color_center
    label: "Other colour centres"
    notes: "SiV, GeV in diamond; defects in SiC, hBN."
  - id: photonic
    label: "Photonic qubits"
    notes: "Linear-optical, measurement-based, integrated photonics."
  - id: trapped_molecule
    label: "Trapped molecules"
    notes: "Polyatomic / diatomic molecular qubits."
  - id: topological
    label: "Topological qubits"
    notes: "Majorana / TQC efforts."
  - id: silicon_spin
    label: "Silicon spin qubits"
    notes: "Donor / quantum-dot spin qubits in silicon."
  - id: quantum_dot
    label: "Quantum dots"
    notes: "Non-silicon QD platforms (GaAs, etc.)."
  - id: cavity_qed_hybrid
    label: "Cavity QED / hybrid"
    notes: "Atoms in cavities, hybrid mechanical-photonic systems."

# ── Applications ────────────────────────────────────────────────────────
# The "what is the platform being used for" axis. Independent of platform.

applications:
  - id: computing
    label: "Quantum computing"
    notes: "Gate-model, analog, fault-tolerant; the application that uses the platform to compute."
  - id: simulation
    label: "Quantum simulation"
    notes: "Analog simulation of condensed matter, lattice gauge, chemistry."
  - id: networking
    label: "Quantum networking & communication"
    notes: "Repeaters, QKD, quantum internet."
  - id: sensing_metrology
    label: "Quantum sensing & metrology"
    notes: "Magnetometry, gravimetry, general high-precision measurement."
  - id: optical_clocks
    label: "Optical clocks"
    notes: "Broken out from sensing_metrology because the community is large and distinct."
  - id: fundamental_physics
    label: "Fundamental physics tests"
    notes: "BSM searches, EDMs, alpha-variation, QED tests via precision measurement."
  - id: software_control
    label: "Software / control / compilation"
    notes: "Control electronics, compilers, EDA, error-correction software."

