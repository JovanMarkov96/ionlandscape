    label: "University"
  - id: national_lab
    label: "National laboratory"
  - id: dedicated_quantum_centre
    label: "Dedicated quantum centre"
    notes: "An organisation whose stated purpose is quantum-information research."
  - id: research_centre
    label: "General research centre"
    notes: "A research centre with quantum activity but broader scope."
  - id: consortium
    label: "Consortium / network / hub"
  - id: government_agency
    label: "Government agency"
  - id: industry_research_lab
    label: "Industry research lab"
    notes: "e.g. IBM Research, Google AI Quantum site (when treated as an institution rather than as the parent company)."
  - id: non_profit
    label: "Non-profit organisation"

# ── Edge types (relationship graph) ─────────────────────────────────────

edge_types:
  - id: advised
    notes: "PhD advisor → student."
  - id: postdoc_with
    notes: "Postdoc supervisor → postdoc."
  - id: cofounded
    notes: "Person → company they co-founded."
  - id: affiliated_with
    notes: "Person → institution / company they are presently affiliated with."
  - id: alumnus_of
    notes: "Person → institution where they trained (PhD/postdoc) but no longer work."
  - id: spun_out_of
    notes: "Company → institution it spun out from."
  - id: acquired_by
    notes: "Company → company that acquired it."
  - id: current_member_of
    notes: "Person → institution where they currently work (cleaner version of affiliated_with for the primary affiliation)."

